  <g transform="translate(36 239) scale(0.95)" fill="none" stroke="#bcc5da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10h16l-1.5-6h-13z"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></g>
  <text x="68" y="258" fill="#e9edf6" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">Marketplace</text>
