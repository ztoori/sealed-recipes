<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">Who can read what</title>
  <desc id="d">Only the creator and the runner can read a recipe's method; the runner only in memory, for a run. Only the buyer and the runner see the buyer's inputs and result. The marketplace stores ciphertext, and everyone else sees hashes and the public listing.</desc>
  <rect x="0.5" y="0.5" width="959" height="329" rx="18" fill="#111a2c" stroke="#212d47"/>
  <text x="32" y="38" fill="#8592ae" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">WHO CAN READ WHAT</text>
  <text x="300" y="74" fill="#e9edf6" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="650">The method</text>
  <text x="300" y="92" fill="#8592ae" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="11.5">wiring, conditions, prompts</text>
  <text x="540" y="74" fill="#e9edf6" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="650">Buyer’s inputs and result</text>
  <text x="780" y="74" fill="#e9edf6" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="13.5" font-weight="650">The listing</text>
  <text x="780" y="92" fill="#8592ae" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="11.5">form, parts, price, risk</text>
  <rect x="276" y="56" width="214" height="262" rx="12" fill="#f0b44c" fill-opacity="0.05" stroke="#7a5a22" stroke-opacity="0.5"/>
  <line x1="32" y1="104" x2="928" y2="104" stroke="#212d47"/>
  <g transform="translate(36 113) scale(0.95)" fill="none" stroke="#bcc5da" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></g>
  <text x="68" y="132" fill="#e9edf6" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600">Creator</text>
  <g transform="translate(300 119)"><circle cx="9" cy="9" r="9" fill="#10271f" stroke="#3ccb9a" stroke-width="1.5"/><path d="M5 9.3l2.6 2.6L13 6.6" fill="none" stroke="#3ccb9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="328" y="133" fill="#bcc5da" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="13">its own sealed copy</text>
