  <g transform="translate(540 203)"><circle cx="9" cy="9" r="9" fill="#10271f" stroke="#3ccb9a" stroke-width="1.5"/><path d="M5 9.3l2.6 2.6L13 6.6" fill="none" stroke="#3ccb9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text x="568" y="217" fill="#bcc5da" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="13">their own</text>
