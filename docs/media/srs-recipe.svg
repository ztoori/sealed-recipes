<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">A recipe that escalates only when needed</title>
  <desc id="d">The buyer names a contract. A reader inspects it and cheap rules judge it. A private AI is asked only when the rules say medium or high risk. The report uses the AI's verdict when there is one, and the rules' verdict otherwise.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#6b7a9c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <marker id="w" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1l8 4-8 4" fill="none" stroke="#f0b44c" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="339" rx="18" fill="#111a2c" stroke="#212d47"/>
  <text x="32" y="38" fill="#8592ae" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">A RECIPE AT A GLANCE · ESCALATE ONLY WHEN NEEDED</text>
  <g fill="none" stroke-width="1.7" stroke-linecap="round">
    <path d="M196 158H232" stroke="#6b7a9c" marker-end="url(#a)"/>
    <path d="M398 150C420 150 420 100 446 100" stroke="#6b7a9c" marker-end="url(#a)"/>
    <path d="M398 166C420 166 420 226 446 226" stroke="#6b7a9c" marker-end="url(#a)"/>
    <path d="M612 226C670 226 690 170 740 170" stroke="#6b7a9c" marker-end="url(#a)"/>
    <path d="M612 100C670 100 690 148 740 148" stroke="#6b7a9c" stroke-dasharray="6 5" marker-end="url(#a)"/>
    <path d="M529 128V190" stroke="#f0b44c" stroke-dasharray="2 5" marker-end="url(#w)"/>
  </g>
  <g font-family="Archivo, 'Segoe UI', system-ui, sans-serif">
    <rect x="30" y="126" width="166" height="64" rx="12" fill="#0f1729" stroke="#56658a" stroke-dasharray="5 4"/>
    <text x="46" y="151" fill="#8592ae" font-size="10.5" font-weight="650" letter-spacing="1.1">BUYER</text>
    <text x="46" y="173" fill="#e9edf6" font-size="14" font-weight="600">Contract to check</text>

    <rect x="232" y="126" width="166" height="64" rx="12" fill="#172238" stroke="#2c3a5a"/><path d="M246 127h138" stroke="#79a8ff" stroke-width="3" stroke-linecap="round"/>
    <text x="248" y="151" fill="#79a8ff" font-size="10.5" font-weight="650" letter-spacing="1.1">READ</text>
    <text x="248" y="173" fill="#e9edf6" font-size="14" font-weight="600">Contract Inspector</text>

    <rect x="446" y="68" width="166" height="64" rx="12" fill="#172238" stroke="#2c3a5a"/><path d="M460 69h138" stroke="#f0b44c" stroke-width="3" stroke-linecap="round"/>
    <text x="462" y="93" fill="#f0b44c" font-size="10.5" font-weight="650" letter-spacing="1.1">CHECK · CHEAP</text>
    <text x="462" y="115" fill="#e9edf6" font-size="14" font-weight="600">Contract Risk Rules</text>

    <rect x="446" y="194" width="166" height="64" rx="12" fill="#172238" stroke="#7a5a22" stroke-dasharray="5 4"/><path d="M460 195h138" stroke="#f0b44c" stroke-width="3" stroke-linecap="round"/>
    <text x="462" y="219" fill="#f0b44c" font-size="10.5" font-weight="650" letter-spacing="1.1">CHECK · PRIVATE AI</text>
    <text x="462" y="241" fill="#e9edf6" font-size="14" font-weight="600">AI Contract Risk</text>
    <g transform="translate(588 228) scale(0.62)" fill="none" stroke="#f0b44c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g>

    <rect x="432" y="146" width="194" height="28" rx="14" fill="#2a2312" stroke="#7a5a22"/>
    <text x="529" y="164.5" fill="#ffd58a" font-size="12" text-anchor="middle">only if risk is medium or high</text>

    <rect x="740" y="126" width="188" height="64" rx="12" fill="#172238" stroke="#2f6e58"/><path d="M754 127h160" stroke="#9aa6c2" stroke-width="3" stroke-linecap="round"/>
    <text x="756" y="151" fill="#9aa6c2" font-size="10.5" font-weight="650" letter-spacing="1.1">REPORT</text>
    <text x="756" y="173" fill="#e9edf6" font-size="14" font-weight="600">Contract Report</text>
    <rect x="790" y="198" width="88" height="22" rx="11" fill="#3ccb9a"/>
    <text x="834" y="213" fill="#0c1220" font-size="11.5" font-weight="700" text-anchor="middle">result</text>
    <text x="834" y="240" fill="#8592ae" font-size="12" text-anchor="middle">verdict: the AI’s, else the rules’</text>
  </g>
  <g font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="12" fill="#8592ae">
    <line x1="32" y1="300" x2="58" y2="300" stroke="#6b7a9c" stroke-width="1.7"/><text x="66" y="304">wire</text>
    <line x1="118" y1="300" x2="144" y2="300" stroke="#6b7a9c" stroke-width="1.7" stroke-dasharray="6 5"/><text x="152" y="304">fallback</text>
    <line x1="226" y1="300" x2="252" y2="300" stroke="#f0b44c" stroke-width="1.7" stroke-dasharray="2 5" stroke-linecap="round"/><text x="260" y="304">condition</text>
    <rect x="336" y="291" width="26" height="18" rx="5" fill="none" stroke="#7a5a22" stroke-dasharray="4 3"/><text x="370" y="304">may be skipped</text>
    <g transform="translate(486 290) scale(0.75)" fill="none" stroke="#f0b44c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></g>
    <text x="510" y="304">sealed: the threshold, the watch list, the prompt</text>
  </g>
</svg>
