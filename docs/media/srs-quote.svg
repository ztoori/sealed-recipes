<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-labelledby="t d">
  <title id="t">How a quote becomes a guarantee</title>
  <desc id="d">The buyer seals their inputs once. The runner dry-runs the recipe and signs a quote. The buyer or an agent picks one and pays. Right before running, the runner re-checks the quote. At settlement, any shortfall below the promise is paid from the creator's deposit.</desc>
  <rect x="0.5" y="0.5" width="959" height="269" rx="18" fill="#111a2c" stroke="#212d47"/>
  <text x="32" y="38" fill="#8592ae" font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">FROM A QUESTION TO A GUARANTEE</text>
  <line x1="90" y1="112" x2="870" y2="112" stroke="#2c3a5a" stroke-width="2"/>
  <g font-family="Archivo, 'Segoe UI', system-ui, sans-serif" text-anchor="middle">
    <g fill="#8592ae" font-size="10.5" font-weight="600" letter-spacing="1.2">
      <text x="90" y="78">BUYER</text><text x="246" y="78">RUNNER</text><text x="402" y="78">BUYER OR AGENT</text>
      <text x="558" y="78">CONTRACT</text><text x="714" y="78">RUNNER</text><text x="870" y="78">CONTRACT</text>
    </g>
    <g stroke-width="1.8">
      <circle cx="90" cy="112" r="20" fill="#2a2312" stroke="#f0b44c"/><circle cx="246" cy="112" r="20" fill="#172238" stroke="#a98bff"/>
      <circle cx="402" cy="112" r="20" fill="#172238" stroke="#79a8ff"/><circle cx="558" cy="112" r="20" fill="#172238" stroke="#79a8ff"/>
      <circle cx="714" cy="112" r="20" fill="#172238" stroke="#a98bff"/><circle cx="870" cy="112" r="20" fill="#10271f" stroke="#3ccb9a"/>
    </g>
    <g fill="#e9edf6" font-size="14" font-weight="700">
      <text x="90" y="117">1</text><text x="246" y="117">2</text><text x="402" y="117">3</text><text x="558" y="117">4</text><text x="714" y="117">5</text><text x="870" y="117">6</text>
    </g>
    <g fill="#e9edf6" font-size="14.5" font-weight="650">
      <text x="90" y="160">Seal inputs</text><text x="246" y="160">Dry run</text><text x="402" y="160">Choose</text>
      <text x="558" y="160">Pay</text><text x="714" y="160">Re-check</text><text x="870" y="160">Settle</text>
    </g>
    <g fill="#8592ae" font-size="12.5">
      <text x="90" y="181">once, for any</text><text x="90" y="197">number of recipes</text>
      <text x="246" y="181">read-only; signs price,</text><text x="246" y="197">promise and cover</text>
      <text x="402" y="181">on value, price,</text><text x="402" y="197">risk and record</text>
      <text x="558" y="181">price capped by you;</text><text x="558" y="197">cover locked</text>
      <text x="714" y="181">wallet changed?</text><text x="714" y="197">abort and refund</text>
      <text x="870" y="181">short of the promise?</text><text x="870" y="197">the deposit pays you</text>
    </g>
  </g>
  <g font-family="Archivo, 'Segoe UI', system-ui, sans-serif" font-size="12.5">
    <path d="M60 222h840" stroke="#2f6e58" stroke-width="1.5" stroke-dasharray="3 5"/>
    <rect x="300" y="208" width="360" height="30" rx="15" fill="#10271f" stroke="#2f6e58"/>
    <text x="480" y="228" fill="#3ccb9a" text-anchor="middle">a failed or aborted run always refunds the buyer</text>
  </g>
</svg>
