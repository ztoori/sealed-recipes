      <h1>Sealed Recipes</h1>
      <p>A marketplace on NEAR where an expert's workflow (a recipe) runs on your data inside sealed hardware. You never see the method, they never see your data, and one settlement pays everyone. Paid per run.</p>
      <p>Users pick a recipe and pay per run; a failed run is refunded. Creators compose recipes from parts without code. Builders write parts to the open spec SRS-1 and earn a fee per use. Runners host the runs inside Intel TDX hardware and earn a fee per run.</p>
      <p>This page needs JavaScript. A plain-text summary with the API is at <a href="./llms.txt">/llms.txt</a>; the source is at <a href="https://github.com/ztoori/sealed-recipes">github.com/ztoori/sealed-recipes</a>.</p>
