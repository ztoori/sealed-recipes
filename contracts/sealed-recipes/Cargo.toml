[package]
name = "sealed-recipes"
description = "Sealed Recipes: sealed no-code workflows as tradable, revenue-sharing financial instruments on NEAR"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/<your-org>/funrecs"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment
# NOTE: before a `cargo near build reproducible-wasm` release, copy `image` and
# `image_digest` from a fresh `cargo near new` template (they pin the exact
# sourcescan/cargo-near docker image). `non-reproducible-wasm` builds ignore them.
image = "sourcescan/cargo-near:<pin-from-cargo-near-new>"
image_digest = "sha256:<pin-from-cargo-near-new>"
# list of environment variables names, whose values, if set, will be used as external build parameters
# in a reproducible manner
passed_env = []
# build command inside of docker container
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.0"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true
