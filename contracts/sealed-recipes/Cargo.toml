[package]
name = "sealed-recipes"
description = "Sealed Recipes: sealed workflows paid per run through NEAR Intents, with signed quotes, guarantee deposits and one-receipt settlement"
version = "0.1.0"
edition = "2021"
license = "MIT"
# NEP-330: cargo-near publishes this link through the `contract_source_metadata` view.
repository = "https://github.com/ztoori/sealed-recipes"

[lib]
crate-type = ["cdylib", "rlib"]

# fields to configure build with WASM reproducibility, according to specs
# in https://github.com/near/NEPs/blob/master/neps/nep-0330.md
[package.metadata.near.reproducible_build]
# docker image, descriptor of build environment (pinned from the current `cargo near new` template)
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
# tag after colon above serves only descriptive purpose; image is identified by digest
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
# list of environment variables names, whose values, if set, will be used as external build parameters
# in a reproducible manner
passed_env = []
# build command inside of docker container
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
near-sdk = "5.30.0"
serde_json = "1"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
# Tell `rustc` to optimize for small code size.
opt-level = "z"
lto = true
debug = false
panic = "abort"
# Opt into extra safety checks on arithmetic operations https://stackoverflow.com/a/64136471/249801
overflow-checks = true
