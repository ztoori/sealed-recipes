# The live runner in an Intel TDX confidential VM on Phala Cloud (dstack). dstack measures this file into the
# attestation (compose_hash), so it pins exactly what runs: the image by digest and every setting below.
# Secrets (${...}) are Phala "Encrypted Secrets": encrypted on your machine to a key held inside the TEE.
# Before deploying, put the digest you pushed in `image:` (see scripts/testnet/README.md, "Runner in a TEE").
services:
  srs-runner:
    image: ghcr.io/ztoori/srs-runner@sha256:87d91271594b9fccc30eeb84d49296375bafe1e67b274fe2d497c051dcc9e18e
    environment:
      TEE_MODE: dstack                              # keys from the TEE's key service, hardware quotes
      RUNNER_HOST: 0.0.0.0
      RUNNER_PORT: "8787"
      SRS_READ_ONLY: "1"                            # mainnet is read-only: recipes that ask the buyer to sign are refused
      RUNNER_ID: tee.sealedrecipes.testnet          # its on-chain identity (registered by scripts/testnet/45-tee-runner.sh)
      CONTRACT_ID: market.sealedrecipes.testnet
      NEAR_RPC_URL: https://rpc.testnet.fastnear.com    # commitments are read from the contract directly
      CHAIN_URL: https://sealedrecipes.xyz/api/chain  # untrusted relayer: only forwards signed reports
      MARKET_URL: https://sealedrecipes.xyz           # stores sealed checkpoints
      RUNNER_TOKEN: ${RUNNER_TOKEN}
      NEAR_AI_API_KEY: ${NEAR_AI_API_KEY}
      ONECLICK_API_KEY: ${ONECLICK_API_KEY}
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    ports:
      - "8787:8787"
    restart: always
